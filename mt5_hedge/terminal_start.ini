; MT5 terminal start config - leg.py launches terminal64.exe with /config:<this file>
; so the "Algo Trading" toolbar switch is ON without clicking. Applies only when the
; terminal is launched by leg.py; a terminal you opened by hand keeps its own settings.
; Keep comments in English: MT5 may read this file with a non-UTF8 codepage.
[Experts]
AllowLiveTrading=1
Enabled=1
AllowDllImport=0
